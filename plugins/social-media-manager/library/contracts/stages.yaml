# Stage registry: the single source of truth for the production pipeline.
# The producer runs jobs through these stages in file order, skipping any stage
# whose `tracks` or `job_types` don't match the job. See docs/STAGE-CONTRACT.md.
#
# Fields
#   id              unique stage id (kebab-case)
#   group           skills/ group folder the stage's skill lives (or will live) in
#   skill           skill folder that runs this stage once it is active
#   status          planned      skipped, with a one-line notice
#                   placeholder  run by the producer itself: writes stand-in outputs
#                                ({placeholder: true, note}) and stops at the real gate;
#                                no skill folder needed
#                   active       run by `skill`, which must exist in `group`
#   reads           contract fields this stage REQUIRES; each must be written by an
#                   earlier stage on every (job_type, track) path that runs it, or be `client`
#   optional_reads  contract fields used if present (may be skipped on the quick track)
#   writes          contract fields this stage produces (job.outputs.<field>)
#   gate            who approves before the job moves on:
#                   admin   the admin only
#                   editor  the assigned editor or designer, or the admin
#                   client  the client, recorded by the assignee or admin from the client's reply
#                   none    automatic
#   credit_spend    true if the stage spends generation credits; the producer checks the
#                   budget and the credit policy (config) before running it
#   tracks          quick | full
#   job_types       video | poster
#
# A stage only reads and writes its declared fields. Gate decisions live in job.gates[],
# so approval stages declare no `writes`.
#
# intake is run by `producer`; it becomes `active` once producer exists (M5).

version: 2

stages:
  # ── Shared opening ────────────────────────────────────────────────
  - id: intake
    group: control
    skill: producer
    status: placeholder
    reads: [client]
    optional_reads: []
    writes: [request]
    gate: admin
    credit_spend: false
    tracks: [quick, full]
    job_types: [video, poster]

  - id: brief
    group: pre-production
    skill: brief
    status: placeholder
    reads: [client, request]
    optional_reads: []
    writes: [brief]
    gate: admin
    credit_spend: false
    tracks: [quick, full]
    job_types: [video, poster]

  - id: concept
    group: pre-production
    skill: concept
    status: placeholder
    reads: [client, brief]
    optional_reads: []
    writes: [concept]
    gate: admin
    credit_spend: false
    tracks: [quick, full]
    job_types: [video, poster]

  # ── Video: pre-production ────────────────────────────────────────
  - id: hooks
    group: pre-production
    skill: hooks
    status: placeholder
    reads: [brief, concept]
    optional_reads: []
    writes: [hooks]
    gate: none
    credit_spend: false
    tracks: [full]
    job_types: [video]

  - id: script
    group: pre-production
    skill: script
    status: placeholder
    reads: [client, brief, concept]
    optional_reads: [hooks]
    writes: [script]
    gate: editor
    credit_spend: false
    tracks: [quick, full]
    job_types: [video]

  - id: localise
    group: pre-production
    skill: localise
    status: placeholder
    reads: [client, script]
    optional_reads: []
    writes: [localised_script]
    gate: editor
    credit_spend: false
    tracks: [full]
    job_types: [video]

  - id: client-script-approval
    group: delivery
    skill: client-messenger
    status: placeholder
    reads: [script]
    optional_reads: [localised_script]
    writes: []
    gate: client
    credit_spend: false
    tracks: [quick, full]
    job_types: [video]

  - id: style-bible
    group: pre-production
    skill: style-bible
    status: placeholder
    reads: [client, brief, concept]
    optional_reads: []
    writes: [style_bible]
    gate: editor
    credit_spend: false
    tracks: [full]
    job_types: [video]

  - id: casting
    group: pre-production
    skill: casting
    status: placeholder
    reads: [script, style_bible]
    optional_reads: []
    writes: [cast]
    gate: editor
    credit_spend: false
    tracks: [full]
    job_types: [video]

  - id: storyboard
    group: pre-production
    skill: storyboard
    status: placeholder
    reads: [script]
    optional_reads: [style_bible, cast]
    writes: [storyboard]
    gate: editor
    credit_spend: false
    tracks: [quick, full]
    job_types: [video]

  - id: production-plan
    group: pre-production
    skill: production-plan
    status: placeholder
    reads: [storyboard]
    optional_reads: []
    writes: [production_plan]
    gate: admin
    credit_spend: false
    tracks: [full]
    job_types: [video]

  # ── Video: generation and quality ────────────────────────────────
  - id: clips
    group: generation
    skill: clips
    status: placeholder
    reads: [storyboard]
    optional_reads: [production_plan, style_bible, cast]
    writes: [clips]
    gate: none
    credit_spend: true
    tracks: [quick, full]
    job_types: [video]

  - id: voice-music
    group: generation
    skill: voice-music
    status: placeholder
    reads: [script]
    optional_reads: [localised_script, storyboard]
    writes: [voiceover, music]
    gate: editor
    credit_spend: true
    tracks: [quick, full]
    job_types: [video]

  - id: qa-clips
    group: quality
    skill: qa-review
    status: placeholder
    reads: [storyboard, clips]
    optional_reads: []
    writes: [qa_report]
    gate: editor
    credit_spend: false
    tracks: [quick, full]
    job_types: [video]

  # ── Video: post-production ───────────────────────────────────────
  - id: assemble
    group: post-production
    skill: assemble
    status: placeholder
    reads: [storyboard, clips, voiceover, music]
    optional_reads: [qa_report]
    writes: [rough_cut]
    gate: editor
    credit_spend: false
    tracks: [quick, full]
    job_types: [video]

  - id: captions-motion
    group: post-production
    skill: captions-motion
    status: placeholder
    reads: [rough_cut, script]
    optional_reads: [localised_script]
    writes: [captions]
    gate: editor
    credit_spend: false
    tracks: [quick, full]
    job_types: [video]

  - id: audio-mix
    group: post-production
    skill: audio-mix
    status: placeholder
    reads: [rough_cut, voiceover, music]
    optional_reads: []
    writes: [audio_mix]
    gate: editor
    credit_spend: false
    tracks: [full]
    job_types: [video]

  - id: finish
    group: post-production
    skill: finish
    status: placeholder
    reads: [rough_cut, captions]
    optional_reads: [audio_mix]
    writes: [master]
    gate: admin
    credit_spend: false
    tracks: [quick, full]
    job_types: [video]

  - id: resolve-export
    group: post-production
    skill: resolve-export
    status: placeholder
    reads: [master]
    optional_reads: []
    writes: [resolve_project]
    gate: none
    credit_spend: false
    tracks: [full]
    job_types: [video]

  - id: client-final-approval
    group: delivery
    skill: client-messenger
    status: placeholder
    reads: [master]
    optional_reads: []
    writes: []
    gate: client
    credit_spend: false
    tracks: [quick, full]
    job_types: [video]

  # ── Poster ───────────────────────────────────────────────────────
  - id: poster-drafts
    group: generation
    skill: poster-design
    status: placeholder
    reads: [client, brief, concept]
    optional_reads: []
    writes: [poster_drafts]
    gate: editor
    credit_spend: true
    tracks: [quick, full]
    job_types: [poster]

  - id: client-poster-approval
    group: delivery
    skill: client-messenger
    status: placeholder
    reads: [poster_drafts]
    optional_reads: []
    writes: []
    gate: client
    credit_spend: false
    tracks: [quick, full]
    job_types: [poster]

  - id: poster-final
    group: generation
    skill: poster-design
    status: placeholder
    reads: [poster_drafts]
    optional_reads: []
    writes: [master]
    gate: admin
    credit_spend: true
    tracks: [quick, full]
    job_types: [poster]

  # ── Shared close ─────────────────────────────────────────────────
  - id: delivery
    group: delivery
    skill: publish
    status: placeholder
    reads: [master]
    optional_reads: [resolve_project]
    writes: [package]
    gate: admin
    credit_spend: false
    tracks: [quick, full]
    job_types: [video, poster]
